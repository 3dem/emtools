# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Release Tests Matrix

on:
#  push:
#    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          # actions/python-versions only ships 3.8/3.9 builds up to Ubuntu 24.04,
          # so they are not available on newer ubuntu-latest images
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.9"
          # macos-latest is arm64 and imagecodecs has no cp38 arm64 wheel
          # (the source build fails), so 3.8 is only tested on Linux
          - os: macos-latest
            python-version: "3.8"
        include:
          - os: ubuntu-24.04
            python-version: "3.8"
          - os: ubuntu-24.04
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Clone testdata and Run the tests
      run: |
        echo "Cloning em-testdata (main branch)"
        git clone https://github.com/3dem/em-testdata.git
        export EM_TESTDATA=em-testdata 
        ls -l $EM_TESTDATA
        python -m unittest emtools.tests.test_metadata
        python -m unittest emtools.tests.test_utils
        python -m unittest emtools.tests.test_pipeline
